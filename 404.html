<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>404 - Page Not Found</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(
135deg,
#0f172a,
#1e293b
);

overflow:hidden;
}

.container{

text-align:center;

color:white;
}

h1{

font-size:8rem;

color:#8b5cf6;

text-shadow:
0 0 30px rgba(139,92,246,.5);
}

h2{

font-size:2rem;

margin-bottom:15px;
}

p{

color:#cbd5e1;

margin-bottom:30px;
}

.btn{

display:inline-block;

padding:14px 35px;

background:
linear-gradient(
135deg,
#8b5cf6,
#06b6d4
);

color:white;

text-decoration:none;

border-radius:50px;

font-weight:600;

transition:.4s;
}

.btn:hover{

transform:
translateY(-5px);

box-shadow:
0 15px 30px rgba(139,92,246,.4);
}

.circle{

position:absolute;

border-radius:50%;

filter:blur(80px);

opacity:.3;
}

.circle1{

width:250px;
height:250px;

background:#8b5cf6;

top:-80px;
left:-80px;
}

.circle2{

width:300px;
height:300px;

background:#06b6d4;

bottom:-100px;
right:-100px;
}

</style></head><body><div class="circle circle1"></div>
<div class="circle circle2"></div><div class="container"><h1>404</h1><h2>Oops! Page Not Found</h2><p>
The page you are looking for doesn't exist
or is currently unavailable.
</p><a href="login.html" class="btn">
Back To Login
</a></div></body>
</html>
