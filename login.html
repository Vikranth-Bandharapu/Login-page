<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Stackly</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head><body><div class="background">
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
    <div class="shape shape4"></div>
</div><div class="login-card">
    <div class="logo">
    <img src="Assests/logo.webp" alt="Stackly Logo">
</div>

<h1>Welcome Back</h1>

<p class="subtitle">
    Login to access your esports dashboard.
</p>

<form id="loginForm">

    <div class="input-box">
        <input type="email" id="email">
        <label>Email Address</label>
        <span class="error" id="emailError"></span>
    </div>

    <div class="input-box">
        <input type="password" id="password">
        <label>Password</label>
        <span class="error" id="passwordError"></span>
    </div>

    <div class="input-box">

        <select id="role">

            <option value="">
                Select Role
            </option>

            <option value="player">
                Player
            </option>

            <option value="manager">
                Team Manager
            </option>

            <option value="admin">
                Admin
            </option>

        </select>

        <span class="error" id="roleError"></span>

    </div>

    <div class="options">

        <a href="404.html">
            Forgot Password?
        </a>

    </div>

    <button type="submit">
        Login
    </button>

</form>

<div class="divider">
    <span>or continue with</span>
</div>

<div class="social-icons">

    <a href="404.html">
        <i class="fab fa-google"></i>
    </a>

    <a href="404.html">
        <i class="fab fa-github"></i>
    </a>

    <a href="404.html">
        <i class="fab fa-facebook-f"></i>
    </a>

</div>

<div class="signup-text">

    Don't have an account?

    <a href="signup.html">
        Sign Up
    </a>

</div>

</div>
<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {

    e.preventDefault();

    let valid = true;

    document.getElementById("emailError").innerText = "";
    document.getElementById("passwordError").innerText = "";
    document.getElementById("roleError").innerText = "";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const role = document.getElementById("role").value;

    // Email Validation
    if(email === ""){
        document.getElementById("emailError").innerText =
        "Email is required";
        valid = false;
    }
    else if(!email.endsWith("@gmail.com")){
        document.getElementById("emailError").innerText =
        "Email must end with @gmail.com";
        valid = false;
    }

    // Password Validation
    if(password === ""){
        document.getElementById("passwordError").innerText =
        "Password is required";
        valid = false;
    }

    // Role Validation
    if(role === ""){
        document.getElementById("roleError").innerText =
        "Please select a role";
        valid = false;
    }

    if(valid){
        

        // Save user details
        localStorage.setItem("playerEmail", email);

        const username = email.split("@")[0];
        localStorage.setItem("playerName", username);

        localStorage.setItem("playerRole", role);

        // Redirect
        if(role === "player"){
            window.location.href = "player-dashboard.html";
        }
        else if(role === "manager"){
            window.location.href = "manager-dashboard.html";
        }
        else if(role === "admin"){
            window.location.href = "admin-dashboard.html";
        }

    }

});

</script>
</body>
</html>
