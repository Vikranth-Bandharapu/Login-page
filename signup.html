<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up - Stackly</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="style.css">
</head><body><div class="background"><div class="shape shape1"></div>
<div class="shape shape2"></div>
<div class="shape shape3"></div>
<div class="shape shape4"></div></div><div class="login-card"><div class="logo">
<h2>STACKLY</h2>
</div><h1>Create Account</h1><p class="subtitle">
Create your esports account and get started.
</p><form id="signupForm"><div class="input-box">
<input type="text" id="fullname">
<label>Full Name</label>
<span class="error" id="nameError"></span>
</div><div class="input-box">
<input type="email" id="email">
<label>Email Address</label>
<span class="error" id="emailError"></span>
</div><div class="input-box">
<input type="tel" id="mobile">
<label>Mobile Number</label>
<span class="error" id="mobileError"></span>
</div><div class="input-box"><select id="role"><option value="">
Select Role
</option><option value="player">
Player
</option><option value="manager">
Team Manager
</option><option value="admin">
Admin
</option></select><span class="error" id="roleError"></span>

</div><div class="input-box">
<input type="password" id="password">
<label>Password</label>
<span class="error" id="passwordError"></span>
</div><div class="input-box">
<input type="password" id="confirmPassword">
<label>Confirm Password</label>
<span class="error" id="confirmError"></span>
</div><button type="submit">
Create Account
</button></form><div class="signup-text">Already have an account?

<a href="login.html">
Login
</a></div></div><script>

document.getElementById("signupForm")
.addEventListener("submit", function(e){

e.preventDefault();

let valid = true;

document.getElementById("nameError").innerText="";
document.getElementById("emailError").innerText="";
document.getElementById("mobileError").innerText="";
document.getElementById("roleError").innerText="";
document.getElementById("passwordError").innerText="";
document.getElementById("confirmError").innerText="";

const fullname =
document.getElementById("fullname").value.trim();

const email =
document.getElementById("email").value.trim();

const mobile =
document.getElementById("mobile").value.trim();

const role =
document.getElementById("role").value;

const password =
document.getElementById("password").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

if(fullname===""){
document.getElementById("nameError").innerText=
"Full Name is required";
valid=false;
}
if(email === ""){

document.getElementById("emailError").innerText =
"Email is required";

valid = false;

}
else if(!email.endsWith("@gmail.com")){

document.getElementById("emailError").innerText =
"Email must end with @gmail.com";

valid = false;

}

if(mobile===""){
document.getElementById("mobileError").innerText=
"Mobile Number is required";
valid=false;
}

if(role===""){
document.getElementById("roleError").innerText=
"Please select a role";
valid=false;
}

if(password===""){
document.getElementById("passwordError").innerText=
"Password is required";
valid=false;
}

if(confirmPassword===""){
document.getElementById("confirmError").innerText=
"Confirm Password is required";
valid=false;
}

if(password!==confirmPassword){
document.getElementById("confirmError").innerText=
"Passwords do not match";
valid=false;
}

if(valid){

alert("Account Created Successfully");

window.location.href=
"login.html";

}

});

</script></body>
</html>
